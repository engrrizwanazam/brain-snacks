<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brain Snacks</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brain Snacks">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2B1B3F">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
/* ==========================================================
   Brain Snacks — paper cut-outs on a night-carnival stage.
   Safari 12 safe: no ?. no ?? no flex gap, no aspect-ratio, no :is().
   ========================================================== */
:root {
  --night:#2B1B3F; --night-2:#3B2757; --night-3:#513673;
  --cream:#FFF6E6; --ink:#241534;
  --tangerine:#FF8A3D; --berry:#F0466F; --leaf:#3FBF7F;
  --sun:#FFC93C; --sky:#6EC6E8;
  --bounce:cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing:border-box; }
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--night); }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--cream); -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
  background-image:
    radial-gradient(circle at 22% 6%, rgba(255,138,61,.16), transparent 45%),
    radial-gradient(circle at 86% 96%, rgba(110,198,232,.13), transparent 48%);
}
.outlined {
  text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),
    0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),0 5px 0 rgba(36,21,52,.45);
}
.screen { display:none; position:absolute; top:0; right:0; bottom:0; left:0; padding:14px 16px; }
.screen.on { display:block; }
.col { display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column; height:100%; }
.row { display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-box-align:center; -webkit-align-items:center; align-items:center; }
.grow { -webkit-box-flex:1; -webkit-flex:1; flex:1; }
.mid { -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center; }

/* ---------- HOME ---------- */
#s-home { text-align:center; }
.logo { font-size:34px; font-weight:800; line-height:.94; letter-spacing:-.035em;
  color:var(--sun); margin:16px 0 0; -webkit-transform:rotate(-3deg); transform:rotate(-3deg); }
.logo .b { color:var(--tangerine); display:block; }
.tag { margin:8px auto 0; max-width:16em; font-size:13px; font-weight:600;
  line-height:1.45; color:rgba(255,246,230,.6); }

.cards { -webkit-box-flex:1; -webkit-flex:1; flex:1; min-height:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  -ms-touch-action:pan-y; touch-action:pan-y;
  padding:4px 3px 10px; margin-top:10px;
  display:-ms-grid; display:grid;
  grid-template-columns:1fr 1fr; grid-gap:10px; gap:10px;
  -ms-grid-rows:min-content; grid-auto-rows:min-content; }
.card { display:block; width:100%; margin:0; padding:7px 6px 6px; border:0;
  border-radius:18px; height:98px; text-align:center; font-family:inherit; position:relative;
  -webkit-transition:-webkit-transform .1s ease; transition:transform .1s ease; }
.card:active { -webkit-transform:translateY(4px); transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.35); }
.cart { display:block; height:42px; }
.cart svg { width:100%; height:100%; display:block; }
.cnm { display:block; font-size:16px; font-weight:800; letter-spacing:-.015em; color:var(--ink); margin-top:3px; }
.csb { display:block; font-size:10.5px; font-weight:700; color:var(--ink); opacity:.62; margin-top:1px; }
.c-tricks { background:#FFC93C; box-shadow:0 5px 0 #C99A16; }
.c-pairs  { background:#6EC6E8; box-shadow:0 5px 0 #4695B4; }
.c-odd    { background:#FF8A3D; box-shadow:0 5px 0 #C4652A; }
.c-echo   { background:#3FBF7F; box-shadow:0 5px 0 #2A8E5C; }
.c-spot   { background:#FF6F92; box-shadow:0 5px 0 #C74C6B; }
.c-slide  { background:#B58BF0; box-shadow:0 5px 0 #8560BC; }
.c-snap   { background:#5FD3C0; box-shadow:0 5px 0 #3E9E8F; }
.c-trail  { background:#FFD84A; box-shadow:0 5px 0 #C9A61E; }
.c-wake   { background:#8FA8F0; box-shadow:0 5px 0 #6579BC; }
.c-sort   { background:#A9E05F; box-shadow:0 5px 0 #7CAB3C; }
.c-maze   { background:#FF9E7A; box-shadow:0 5px 0 #C46F52; }
.c-untangle { background:#7FD9C4; box-shadow:0 5px 0 #55A793; }
.c-which  { background:#FFB0C8; box-shadow:0 5px 0 #C97E96; }
.c-fill   { background:#C9B4F5; box-shadow:0 5px 0 #9585C0; }
.c-cups   { background:#F58BA0; box-shadow:0 5px 0 #C05F73; }
.c-follow { background:#7FC4E8; box-shadow:0 5px 0 #5691B4; }
.c-howmany{ background:#8FD98F; box-shadow:0 5px 0 #61A661; }
.c-pile   { background:#F5C86B; box-shadow:0 5px 0 #C09642; }
.c-colour { background:#D9A0F0; box-shadow:0 5px 0 #A472BC; }
.c-opp    { background:#9FD8C4; box-shadow:0 5px 0 #6EA592; }
.wrapfull { grid-column:1 / span 2; }
.rulebar { margin-top:9px; padding:10px; border-radius:13px; background:var(--cream);
  color:var(--ink); font-size:14px; font-weight:800; letter-spacing:.06em; text-align:center;
  box-shadow:0 4px 0 rgba(36,21,52,.4); }
.mini { border:0; background:none; padding:10px 13px; margin:0; font-family:inherit;
  font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:rgba(255,246,230,.5); }
.mini:active { color:var(--cream); }

.big { display:block; width:100%; margin:0 0 11px; padding:19px; border:0; border-radius:19px;
  font-family:inherit; font-size:20px; font-weight:800; letter-spacing:-.01em;
  color:var(--ink); background:var(--sun); box-shadow:0 5px 0 #C99A16;
  -webkit-transition:-webkit-transform .1s ease; transition:transform .1s ease; }
.big:active { -webkit-transform:translateY(4px); transform:translateY(4px); box-shadow:0 1px 0 #C99A16; }
.big.alt { background:var(--night-3); color:var(--cream); box-shadow:0 5px 0 #34204B; }
.big.alt:active { box-shadow:0 1px 0 #34204B; }

/* ---------- LEVEL GRID ---------- */
.grid { display:-ms-grid; display:grid; grid-template-columns:repeat(4,1fr);
  grid-gap:10px; gap:10px; overflow-y:auto; -webkit-overflow-scrolling:touch;
  -ms-touch-action:pan-y; touch-action:pan-y; padding:4px 2px 10px; }
.node { border:0; padding:0; margin:0; height:62px; border-radius:16px; font-family:inherit;
  font-size:21px; font-weight:800; background:var(--night-3); color:rgba(255,246,230,.85);
  box-shadow:0 4px 0 #2E1C44; position:relative; }
.node.done { background:var(--leaf); color:#10381F; box-shadow:0 4px 0 #2A8E5C; }
.node.next { background:var(--sun); color:var(--ink); box-shadow:0 4px 0 #C99A16; }
.node.lock { background:rgba(81,54,115,.35); color:rgba(255,246,230,.22); box-shadow:none; }
.node:active { -webkit-transform:translateY(3px); transform:translateY(3px); }
.node .tick { position:absolute; top:4px; right:7px; font-size:10px; opacity:.75; }

/* ---------- HUD ---------- */
.hud { height:34px; margin-bottom:5px; }
.lvnum { font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  color:rgba(255,246,230,.5); }
.score { font-size:15px; font-weight:800; color:var(--sun); }
.bulb { border:0; margin:0; padding:6px 12px; border-radius:12px; background:var(--night-2); font-size:18px; line-height:1; }
.bulb.beg { background:var(--sun); -webkit-animation:nag 1.1s ease-in-out infinite; animation:nag 1.1s ease-in-out infinite; }
@-webkit-keyframes nag{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.12)}}
@keyframes nag{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

.ask { background:var(--cream); color:var(--ink); border-radius:17px; padding:13px 15px;
  font-size:18px; font-weight:800; line-height:1.25; letter-spacing:-.015em; text-align:center;
  box-shadow:0 5px 0 rgba(36,21,52,.4); min-height:52px; }

.stage-box { position:relative; width:100%; padding-bottom:83.33%; margin-top:12px;
  border-radius:20px; overflow:hidden; box-shadow:0 6px 0 rgba(36,21,52,.45), inset 0 0 0 3px rgba(36,21,52,.5); }
.arena-box { position:relative; width:100%; padding-bottom:116.67%; margin-top:8px;
  border-radius:20px; overflow:hidden; box-shadow:0 6px 0 rgba(36,21,52,.45), inset 0 0 0 3px rgba(36,21,52,.5); }
.stage-box svg, .arena-box svg { position:absolute; top:0; right:0; bottom:0; left:0;
  width:100%; height:100%; display:block; -ms-touch-action:none; touch-action:none; }

.tray { margin-top:auto; padding-top:11px; display:-ms-grid; display:grid;
  grid-template-columns:repeat(4,1fr); grid-gap:9px; gap:9px; }
.tray:empty { display:none; }
.chip { border:0; padding:0; margin:0; height:56px; border-radius:15px; font-family:inherit;
  font-size:24px; font-weight:800; background:var(--cream); color:var(--ink);
  box-shadow:0 4px 0 rgba(36,21,52,.45); }
.chip:active { -webkit-transform:translateY(3px); transform:translateY(3px); }
.chip.bad { background:var(--berry); color:#fff; -webkit-animation:nope .35s ease; animation:nope .35s ease; }
@-webkit-keyframes nope{0%,100%{-webkit-transform:translateX(0)}22%{-webkit-transform:translateX(-8px)}48%{-webkit-transform:translateX(7px)}74%{-webkit-transform:translateX(-3px)}}
@keyframes nope{0%,100%{transform:translateX(0)}22%{transform:translateX(-8px)}48%{transform:translateX(7px)}74%{transform:translateX(-3px)}}

/* timer / progress bar */
.bar { height:9px; border-radius:6px; background:rgba(36,21,52,.5); overflow:hidden; margin-top:2px; }
.bar i { display:block; height:100%; width:100%; background:var(--leaf); border-radius:6px; }
.bar.warn i { background:var(--berry); }

/* ---------- TOAST / OVERLAY ---------- */
.toast { position:absolute; left:16px; right:16px; top:46%; text-align:center;
  font-size:38px; font-weight:800; letter-spacing:-.03em; color:var(--berry);
  pointer-events:none; opacity:0; z-index:40; }
.toast.go { -webkit-animation:toastup .95s ease both; animation:toastup .95s ease both; }
@-webkit-keyframes toastup{0%{opacity:0;-webkit-transform:scale(.6) rotate(-8deg)}22%{opacity:1;-webkit-transform:scale(1.08) rotate(-4deg)}72%{opacity:1;-webkit-transform:scale(1) rotate(-4deg)}100%{opacity:0;-webkit-transform:scale(1) rotate(-4deg) translateY(-22px)}}
@keyframes toastup{0%{opacity:0;transform:scale(.6) rotate(-8deg)}22%{opacity:1;transform:scale(1.08) rotate(-4deg)}72%{opacity:1;transform:scale(1) rotate(-4deg)}100%{opacity:0;transform:scale(1) rotate(-4deg) translateY(-22px)}}

.over { position:absolute; top:0; right:0; bottom:0; left:0; background:rgba(43,27,63,.94);
  z-index:60; display:none; padding:18px; text-align:center; }
.over.on { display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column;
  -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center; }
.over-word { font-size:48px; font-weight:800; letter-spacing:-.035em; color:var(--leaf);
  -webkit-animation:pop .5s var(--bounce) both; animation:pop .5s var(--bounce) both; }
.over-word.cool { color:var(--sun); }
@-webkit-keyframes pop{0%{-webkit-transform:scale(.3);opacity:0}100%{-webkit-transform:scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.over-why { margin:13px auto 24px; max-width:17em; font-size:15.5px; font-weight:600;
  line-height:1.5; color:rgba(255,246,230,.75); }

.bit { position:absolute; width:11px; height:15px; top:-20px; border-radius:2px; z-index:55; pointer-events:none; }
@-webkit-keyframes fall{to{-webkit-transform:translateY(105vh) rotate(540deg);opacity:0}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}

#hint { position:absolute; left:16px; right:16px; bottom:16px; background:var(--cream); color:var(--ink);
  border-radius:19px; padding:17px; box-shadow:0 7px 0 rgba(36,21,52,.5); z-index:50; display:none; }
#hint.on { display:block; -webkit-animation:rise .28s var(--bounce) both; animation:rise .28s var(--bounce) both; }
@-webkit-keyframes rise{from{-webkit-transform:translateY(40px);opacity:0}to{-webkit-transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.hint-txt { font-size:15.5px; font-weight:700; line-height:1.45; margin:0 0 13px; }
.hint-btns { display:-ms-grid; display:grid; grid-template-columns:1fr 1fr; grid-gap:9px; gap:9px; }
.hint-btns button { border:0; padding:12px; border-radius:12px; font-family:inherit;
  font-size:14px; font-weight:800; background:var(--night); color:var(--cream); }
.hint-btns button.ghost { background:rgba(36,21,52,.12); color:var(--ink); }

.picker { display:-ms-grid; display:grid; grid-template-columns:repeat(3,1fr); grid-gap:9px; gap:9px; margin-top:10px; }
.picker button { border:0; padding:14px 6px; border-radius:15px; font-family:inherit;
  font-size:14px; font-weight:800; background:var(--night-3); color:var(--cream); }
.picker button.sel { background:var(--sun); color:var(--ink); }

/* ---------- play log (grown-ups only) ---------- */
.sheet { position:absolute; top:0; right:0; bottom:0; left:0; background:#1B1029;
  z-index:80; display:none; padding:16px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.sheet.on { display:block; }
.sheet h2 { margin:0 0 4px; font-size:17px; font-weight:800; color:var(--cream); }
.st-sum { margin:2px 0 10px; font-size:12.5px; font-weight:600; line-height:1.4;
  color:rgba(255,246,230,.65); }
table.st { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums;
  color:rgba(255,246,230,.85); margin-bottom:14px; }
table.st th { text-align:right; font-size:10px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:rgba(255,246,230,.4); padding:3px 4px; }
table.st th:first-child, table.st td:first-child { text-align:left; }
table.st td { text-align:right; padding:3px 4px; border-top:1px solid rgba(255,246,230,.09); }
table.st tr.no td:first-child { color:#FF8A3D; font-weight:800; }
table.st tr.ok td:first-child { color:var(--leaf); }
.sheet .big { font-size:16px; padding:14px; }

@media (max-height:600px){
  .card{height:92px}
  .cart{height:40px}
  .cnm{font-size:15px}
  .ask{font-size:16px;padding:10px 13px;min-height:46px}
  .chip{height:50px;font-size:21px}
  .logo{font-size:38px}
  /* The arcade screen with a footer picker is the tightest thing in the app:
     at 375x553 it computed to 513 of 525, about 12px clear, and .col has no
     overflow so it would spill rather than scroll. Trimming the picker here
     buys 8px back for every game that uses one. */
  .picker{margin-top:7px}
  .picker button{padding:10px 6px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){ *{-webkit-animation-duration:.01ms!important;animation-duration:.01ms!important} }
</style>
</head>
<body>

<!-- ===== HOME: pick a game ===== -->
<section class="screen on" id="s-home">
  <div class="col">
    <div>
      <h1 class="logo outlined" id="logo"><span class="b">Brain</span>Snacks</h1>
      <p class="tag">Twenty games. Most of them have a catch.</p>
    </div>
    <div class="cards">
      <button class="card c-tricks" data-go="tricks">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-tricks"></svg></span>
        <span class="cnm">Tricks</span>
        <span class="csb" id="sub-tricks">56 puzzles</span>
      </button>
      <button class="card c-pairs" data-go="pairs">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-pairs"></svg></span>
        <span class="cnm">Pairs</span>
        <span class="csb" id="sub-pairs">Match the faces</span>
      </button>
      <button class="card c-odd" data-go="odd">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-odd"></svg></span>
        <span class="cnm">Odd One</span>
        <span class="csb" id="sub-odd">Spot it fast</span>
      </button>
      <button class="card c-echo" data-go="echo">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-echo"></svg></span>
        <span class="cnm">Echo</span>
        <span class="csb" id="sub-echo">Repeat it back</span>
      </button>
      <button class="card c-spot" data-go="spot">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-spot"></svg></span>
        <span class="cnm">Spot It</span>
        <span class="csb" id="sub-spot">Find the changes</span>
      </button>
      <button class="card c-slide" data-go="slide">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-slide"></svg></span>
        <span class="cnm">Slide</span>
        <span class="csb" id="sub-slide">Put it in order</span>
      </button>
      <button class="card c-snap" data-go="snap">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-snap"></svg></span>
        <span class="cnm">Snapshot</span>
        <span class="csb" id="sub-snap">Remember where</span>
      </button>
      <button class="card c-trail" data-go="trail">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-trail"></svg></span>
        <span class="cnm">Trail</span>
        <span class="csb" id="sub-trail">1, A, 2, B...</span>
      </button>
      <button class="card c-wake" data-go="wake">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-wake"></svg></span>
        <span class="cnm">Wake Up</span>
        <span class="csb" id="sub-wake">Don't tap sleepers</span>
      </button>
      <button class="card c-sort" data-go="sort">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-sort"></svg></span>
        <span class="cnm">Sort It</span>
        <span class="csb" id="sub-sort">The rule changes</span>
      </button>
      <button class="card c-maze" data-go="maze">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-maze"></svg></span>
        <span class="cnm">Maze</span>
        <span class="csb" id="sub-maze">Find the way out</span>
      </button>
      <button class="card c-untangle" data-go="untangle">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-untangle"></svg></span>
        <span class="cnm">Untangle</span>
        <span class="csb" id="sub-untangle">No crossed lines</span>
      </button>
      <button class="card c-which" data-go="which">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-which"></svg></span>
        <span class="cnm">Which Way</span>
        <span class="csb" id="sub-which">Ignore the others</span>
      </button>
      <button class="card c-fill" data-go="fill">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-fill"></svg></span>
        <span class="cnm">Fill It</span>
        <span class="csb" id="sub-fill">Cover every square</span>
      </button>
      <button class="card c-cups" data-go="cups">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-cups"></svg></span>
        <span class="cnm">Cups</span>
        <span class="csb" id="sub-cups">Where is the ball?</span>
      </button>
      <button class="card c-follow" data-go="follow">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-follow"></svg></span>
        <span class="cnm">Follow</span>
        <span class="csb" id="sub-follow">Keep your eye on them</span>
      </button>
      <button class="card c-howmany" data-go="howmany">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-howmany"></svg></span>
        <span class="cnm">How Many</span>
        <span class="csb" id="sub-howmany">A quick look</span>
      </button>
      <button class="card c-pile" data-go="pile">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-pile"></svg></span>
        <span class="cnm">Which Pile</span>
        <span class="csb" id="sub-pile">More, not bigger</span>
      </button>
      <button class="card c-colour" data-go="colour">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-colour"></svg></span>
        <span class="cnm">Say the Colour</span>
        <span class="csb" id="sub-colour">Ignore the word</span>
      </button>
      <button class="card c-opp" data-go="opp">
        <span class="cart"><svg viewBox="0 0 84 42" id="ic-opp"></svg></span>
        <span class="cnm">Opposite Day</span>
        <span class="csb" id="sub-opp">Tap the other one</span>
      </button>
      <div class="row mid wrapfull">
        <button class="mini" id="mute-1">Sound on</button>
        <button class="mini" id="wipe">Start over</button>
      </div>
    </div>
  </div>
</section>

<!-- ===== PUZZLE PICKER ===== -->
<section class="screen" id="s-grid">
  <div class="col">
    <div class="row hud">
      <button class="mini" id="grid-back" style="padding-left:0">&larr; Back</button>
      <span class="grow"></span>
      <span class="lvnum" id="grid-count"></span>
    </div>
    <div class="grid grow" id="nodes"></div>
  </div>
</section>

<!-- ===== PUZZLE PLAY ===== -->
<section class="screen" id="s-play">
  <div class="col">
    <div class="row hud">
      <button class="mini" id="quit" style="padding-left:0">&larr;</button>
      <span class="lvnum grow" id="lvnum"></span>
      <button class="mini" id="mute-2">&#9834;</button>
      <button class="bulb" id="bulb">&#128161;</button>
    </div>
    <div class="ask" id="ask"></div>
    <div class="stage-box"><svg id="stage" viewBox="0 0 360 300" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div class="tray" id="tray"></div>
  </div>
  <div class="toast" id="toast"></div>
  <div id="hint">
    <p class="hint-txt" id="hint-txt"></p>
    <div class="hint-btns">
      <button class="ghost" id="hint-close">Let me try</button>
      <button id="hint-more">Just tell me</button>
    </div>
  </div>
  <div class="over" id="win">
    <div class="over-word outlined" id="win-word">Nice!</div>
    <p class="over-why" id="win-why"></p>
    <button class="big" id="next">Next puzzle</button>
    <button class="big alt" id="win-menu">All puzzles</button>
  </div>
</section>

<!-- ===== ARCADE (Pairs / Odd One) ===== -->
<section class="screen" id="s-arcade">
  <div class="col">
    <div class="row hud">
      <button class="mini" id="ar-back" style="padding-left:0">&larr;</button>
      <span class="lvnum grow" id="ar-title"></span>
      <span class="score" id="ar-score"></span>
    </div>
    <div class="bar" id="ar-bar"><i id="ar-fill"></i></div>
    <div class="arena-box"><svg id="arena" viewBox="0 0 360 420" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div id="ar-foot"></div>
  </div>
  <div class="toast" id="ar-toast"></div>
  <div class="over" id="ar-over">
    <div class="over-word outlined cool" id="ao-word">Done!</div>
    <p class="over-why" id="ao-why"></p>
    <button class="big" id="ao-again">Play again</button>
    <button class="big alt" id="ao-home">Back</button>
  </div>
</section>

<!-- ===== PLAY LOG: hold the title for 3s. Local only, never sent anywhere. ===== -->
<section class="sheet" id="stats">
  <h2>Play log</h2>
  <div id="stats-body"></div>
  <button class="big alt" id="stats-clear">Clear the log</button>
  <button class="big" id="stats-close">Close</button>
</section>
