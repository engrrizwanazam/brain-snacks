name: Bump SW version
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update VERSION in sw.js
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i "s/var VERSION = '.*'/var VERSION = 'brain-snacks-$SHORT'/" sw.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git diff --quiet sw.js || (git add sw.js && git commit -m "auto-bump sw version to $SHORT" && git push)
